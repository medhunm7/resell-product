<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReMarket - Used Products</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">♻️ ReMarket</div>

    <nav>
        <a href="#home">Home</a>
        <a href="#products">Products</a>
        <a href="#sell">Sell</a>
        <a href="#favorites">❤️ Favorites</a>
    </nav>
</header>

<section class="hero" id="home">
    <div>
        <h1>Buy Smart. Sell Easy.</h1>
        <p>Find great used products at affordable prices.</p>
        <a href="#products" class="hero-btn">Explore Products</a>
    </div>
</section>

<section class="search-area">
    <input type="text" id="search" placeholder="🔍 Search products...">

    <select id="category">
        <option value="all">All Categories</option>
        <option value="Electronics">Electronics</option>
        <option value="Furniture">Furniture</option>
        <option value="Vehicles">Vehicles</option>
        <option value="Books">Books</option>
        <option value="Fashion">Fashion</option>
        <option value="Others">Others</option>
    </select>

    <select id="price">
        <option value="all">Any Price</option>
        <option value="5000">Below ₹5,000</option>
        <option value="10000">Below ₹10,000</option>
        <option value="25000">Below ₹25,000</option>
    </select>
</section>

<section class="products-section" id="products">

    <div class="section-title">
        <h2>✨ Available Products</h2>
        <span id="productCount"></span>
    </div>

    <div id="productList" class="product-grid"></div>

</section>

<section class="sell-section" id="sell">

    <h2>📦 Sell Your Product</h2>
    <p>Enter your product details and publish your listing.</p>

    <form id="sellForm">

        <input type="text" id="productName"
               placeholder="Product Name" required>

        <select id="productCategory" required>
            <option value="">Select Category</option>
            <option>Electronics</option>
            <option>Furniture</option>
            <option>Vehicles</option>
            <option>Books</option>
            <option>Fashion</option>
            <option>Others</option>
        </select>

        <input type="number" id="productPrice"
               placeholder="Price ₹" min="1" required>

        <input type="text" id="sellerName"
               placeholder="Your Name" required>

        <input type="tel" id="sellerPhone"
               placeholder="Phone Number" required>

        <input type="text" id="productImage"
               placeholder="Image URL (optional)">

        <textarea id="productDescription"
                  placeholder="Product Description"
                  required></textarea>

        <button type="submit">➕ Publish Product</button>

    </form>

</section>

<div id="modal" class="modal">

    <div class="modal-content">

        <span class="close" onclick="closeModal()">×</span>

        <img id="modalImage">

        <h2 id="modalName"></h2>

        <h3 id="modalPrice"></h3>

        <p id="modalCategory"></p>

        <p id="modalDescription"></p>

        <p id="modalSeller"></p>

        <a id="callSeller" class="call-btn">📞 Contact Seller</a>

        <button id="deleteBtn" class="delete-btn">
            🗑️ Delete Listing
        </button>

    </div>

</div>

<footer>
    <p>© 2026 ReMarket | Buy & Sell Used Products</p>
</footer>

<script src="script.js"></script>

</body>
</html>
